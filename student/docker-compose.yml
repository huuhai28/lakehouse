
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # ── MySQL ─────────────────────────────────────────────────
  mysql:
    image: debezium/example-mysql:2.4
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_USER: mysqluser
      MYSQL_PASSWORD: mysqlpw
  # ── PostgreSQL (bật logical replication cho Debezium) ─────
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    command: postgres -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: congty

  # ── MongoDB (chạy Replica Set cho Debezium) ───────────────
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    command: mongod --replSet rs0 --bind_ip_all

  mongo-init:
    image: mongo:6
    container_name: mongo-init
    depends_on:
      - mongo
    restart: "no"
    entrypoint: >
      bash -c "
        sleep 5 &&
        mongosh --host mongo --eval
        'rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]})'
      "

  connect:
    image: debezium/connect:2.4
    container_name: debezium
    ports:
      - "8083:8083"
    extra_hosts:
      - "hivemetastore:172.18.0.20"   # ← THÊM DÒNG NÀY

    depends_on:
      - kafka
      - mysql
    volumes:
      - ./iceberg-kafka-connect:/kafka/connect/iceberg-kafka-connect
      - ./core-site.xml:/kafka/config/core-site.xml

    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: us-east-1
      HADOOP_CONF_DIR: /kafka/config
  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "8089:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  flink-jobmanager:
    image: flink:1.18
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    volumes:
      - .:/opt/flink/lib/custom_libs  # Mount thư mục hiện tại vào container
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
    extra_hosts:
      - "hive-metastore:172.18.0.6"
      - "hive-metastore.student_default:172.18.0.6"
  flink-taskmanager:
    image: flink:1.18
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    volumes:
      - .:/opt/flink/lib/custom_libs
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=50
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 25
        taskmanager.memory.process.size: 6144m
    extra_hosts:
      - "hive-metastore:172.18.0.6"
      - "hive-metastore.student_default:172.18.0.6"
  flink-sql-client:
    image: flink:1.18
    container_name: flink-sql-client
    depends_on:
      - flink-jobmanager
    command: bin/sql-client.sh
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
    volumes:
      - .:/opt/flink/lib/custom_libs
    tty: true
    extra_hosts:
      - "hive-metastore:172.18.0.6"
      - "hive-metastore.student_default:172.18.0.6"
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
  trino:
    image: trinodb/trino:406
    container_name: trino
    ports:
      - "8080:8080"
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://minio:9000
    volumes:
      - ./trino-conf/iceberg.properties:/etc/trino/catalog/iceberg.properties
      - ./trino-conf/minio.properties:/etc/trino/catalog/minio.properties

  superset-db:
    image: postgres:15
    container_name: superset-db
    environment:
      - POSTGRES_USER=superset
      - POSTGRES_PASSWORD=superset
      - POSTGRES_DB=superset
      - POSTGRES_HOST_AUTH_METHOD=trust
  superset-redis:
    image: redis:7
    container_name: superset-redis

  superset:
    image: apache/superset:3.1.3
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=supersecretkey123456
      - DATABASE_URL=postgresql+psycopg2://superset:superset@superset-db/superset
      - REDIS_URL=redis://superset-redis:6379/0
    depends_on:
      - superset-db
      - superset-redis
    command: >-
      /bin/sh -c "pip install 'trino[sqlalchemy]' -q && superset db upgrade && superset fab create-admin --username admin --firstname Admin --lastname User --email admin@admin.com --password admin123 2>/dev/null || true && superset init && superset run -h 0.0.0.0 -p 8088"

  # OpenMetadata cần Elasticsearch để tìm kiếm
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - network.host=0.0.0.0
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    healthcheck:  # ← THÊM phần này
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  openmetadata-db:
    image: postgres:15
    container_name: openmetadata-db
    environment:
      - POSTGRES_USER=om_user
      - POSTGRES_PASSWORD=om_password
      - POSTGRES_DB=openmetadata_db
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U om_user -d openmetadata_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Server chính của OpenMetadata
  openmetadata-server:
    image: openmetadata/server:1.4.2
    container_name: openmetadata-server
    ports:
      - "8585:8585"
    environment:
      - DB_DRIVER_CLASS=org.postgresql.Driver
      - DB_SCHEME=postgresql
      - DB_USER=om_user
      - DB_PASSWORD=om_password
      - DB_HOST=openmetadata-db
      - DB_PORT=5432
      - DB_NAME=openmetadata_db
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_SCHEME=http
      - PIPELINE_SERVICE_CLIENT_ENDPOINT=http://openmetadata-ingestion:8080
      - PIPELINE_SERVICE_CLIENT_TYPE=airflow
      - PIPELINE_SERVICE_CLIENT_AUTH_CONFIG_TYPE=basic
      - PIPELINE_SERVICE_CLIENT_AUTH_CONFIG_USERNAME=admin
      - PIPELINE_SERVICE_CLIENT_AUTH_CONFIG_PASSWORD=admin
      - SERVER_HOST_API_URL=http://openmetadata-server:8585/api
      - MIGRATION_LIMIT_PARAM=1300  # ← THÊM dòng này nếu chưa có
      - _PIP_ADDITIONAL_REQUIREMENTS=openmetadata-managed-apis==1.4.2  # THÊM DÒNG NÀY
    depends_on:
      openmetadata-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  ingestion:
    image: openmetadata/ingestion:1.4.2
    container_name: openmetadata-ingestion
    command: standalone
    ports:
      - "8070:8080"
    environment:
      - AIRFLOW_ADMIN_USER=admin
      - AIRFLOW_ADMIN_PASSWORD=admin
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - AUTH_PROVIDER=no-auth
      - OPENMETADATA_SERVER_URL=http://openmetadata-server:8585/api
      - AIRFLOW__WEBSERVER__SECRET_KEY=openmetadata_secret_key
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - _PIP_ADDITIONAL_REQUIREMENTS=openmetadata-managed-apis==1.4.2
    depends_on:
      - openmetadata-server


  hive-metastore:
    container_name: hive-metastore
    hostname: hive-metastore
    image: apache/hive:3.1.3
    entrypoint: /opt/hive-entrypoint.sh
    environment:
      IS_RESUME: "true"
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      SERVICE_OPTS: >
        -Djavax.jdo.option.ConnectionURL=jdbc:mysql://mysql:3306/hive_metastore
        -Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver
        -Djavax.jdo.option.ConnectionUserName=root
        -Djavax.jdo.option.ConnectionPassword=123

    volumes:
      - ./mysql-connector-java-8.0.28.jar:/opt/hive/lib/mysql-connector-java-8.0.28.jar
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hive-site-override.xml:/opt/hive/conf/hive-site.xml
      - ./hive-entrypoint.sh:/opt/hive-entrypoint.sh
      - ./hadoop-aws-3.1.0.jar:/opt/hadoop/share/hadoop/common/lib/hadoop-aws-3.1.0.jar
      - ./aws-java-sdk-bundle-1.11.271.jar:/opt/hadoop/share/hadoop/common/lib/aws-java-sdk-bundle-1.11.271.jar
    ports:
      - "9083:9083"
    depends_on:
      - mysql
    networks:
      default:
        ipv4_address: 172.18.0.20   # THÊM IP CỐ ĐỊNH

networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
